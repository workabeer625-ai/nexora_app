org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true

# Work around Kotlin incremental cache failures on Windows when the project
# and the Pub cache live on different drives (for example D:\ and C:\).
kotlin.incremental=false
org.gradle.caching=true